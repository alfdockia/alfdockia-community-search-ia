[build-system]
requires = ["setuptools>=77.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "alfdockia-community-search-ia"
dynamic = ["version"]
readme = "README.md"
authors = [{name = "AIgen Technologies S.L"}]
license-files = ["LICENSE", "COPYRIGHT"]
description = "Semantic Alfresco-compatible search service backed by OpenAI embeddings and Qdrant."
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.116.1",
    "uvicorn[standard]==0.35.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["alfdockia.community.search.ia*"]
namespaces = true

[tool.setuptools.dynamic]
version = {attr = "alfdockia.community.search.ia.__version__"}
