services:
  alfdockia-community-search-ia:
    image: alfdockia-community-search-ia:1.0.0
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      APP_HOST: ${APP_HOST:-0.0.0.0}
      APP_PORT: ${APP_PORT:-8083}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}

      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_API_BASE_URL: ${OPENAI_API_BASE_URL:-https://api.openai.com}
      OPENAI_API_ORGANIZATION: ${OPENAI_API_ORGANIZATION:-}
      OPENAI_API_PROJECT: ${OPENAI_API_PROJECT:-}
      OPENAI_EMBEDDINGS_PATH: ${OPENAI_EMBEDDINGS_PATH:-/v1/embeddings}
      OPENAI_EMBEDDINGS_MODEL: ${OPENAI_EMBEDDINGS_MODEL:-text-embedding-3-small}
      OPENAI_EMBEDDINGS_DIMENSIONS: ${OPENAI_EMBEDDINGS_DIMENSIONS:-}
      OPENAI_EMBEDDINGS_ENCODING_FORMAT: ${OPENAI_EMBEDDINGS_ENCODING_FORMAT:-float}
      OPENAI_CHAT_PATH: ${OPENAI_CHAT_PATH:-/v1/chat/completions}
      OPENAI_CHAT_MODEL: ${OPENAI_CHAT_MODEL:-gpt-4o-mini}
      OPENAI_CHAT_MAX_TOKENS: ${OPENAI_CHAT_MAX_TOKENS:-4000}
      OPENAI_TIMEOUT_SECONDS: ${OPENAI_TIMEOUT_SECONDS:-60}

      QDRANT_URL: ${QDRANT_URL:-http://host.docker.internal:6333}
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      QDRANT_COLLECTION_NAME: ${QDRANT_COLLECTION_NAME:-alfresco-content}
      QDRANT_VECTOR_NAME: ${QDRANT_VECTOR_NAME:-dense}
      QDRANT_SPARSE_VECTOR_NAME: ${QDRANT_SPARSE_VECTOR_NAME:-bm25}
      QDRANT_QUERY_TIMEOUT_SECONDS: ${QDRANT_QUERY_TIMEOUT_SECONDS:-60}
      QDRANT_DENSE_SCORE_THRESHOLD: ${QDRANT_DENSE_SCORE_THRESHOLD:-}

      ALFRESCO_API_BASE_URL: ${ALFRESCO_API_BASE_URL:-http://host.docker.internal:8080/alfresco/api}
      ALFRESCO_USERNAME: ${ALFRESCO_USERNAME:-}
      ALFRESCO_PASSWORD: ${ALFRESCO_PASSWORD:-}
      ALFRESCO_AUTHORITY_RESOLUTION_ENABLED: ${ALFRESCO_AUTHORITY_RESOLUTION_ENABLED:-false}
      ALFRESCO_TIMEOUT_SECONDS: ${ALFRESCO_TIMEOUT_SECONDS:-20}

      SEARCH_DEFAULT_MAX_ITEMS: ${SEARCH_DEFAULT_MAX_ITEMS:-25}
      SEARCH_MAX_ITEMS_LIMIT: ${SEARCH_MAX_ITEMS_LIMIT:-100}
      SEARCH_DEFAULT_AUTHORITIES: ${SEARCH_DEFAULT_AUTHORITIES:-GROUP_EVERYONE}
      SEARCH_ADMIN_USERS: ${SEARCH_ADMIN_USERS:-admin,system}
      SEARCH_ADMIN_AUTHORITIES: ${SEARCH_ADMIN_AUTHORITIES:-GROUP_ALFRESCO_ADMINISTRATORS,ALFRESCO_ADMINISTRATORS,ROLE_ADMINISTRATOR}
      SEARCH_REQUIRE_PRINCIPAL: ${SEARCH_REQUIRE_PRINCIPAL:-true}
      SEARCH_REQUIRE_AUTHORITIES: ${SEARCH_REQUIRE_AUTHORITIES:-true}
      SEARCH_API_KEY: ${SEARCH_API_KEY:-}
      SEARCH_API_KEY_HEADER: ${SEARCH_API_KEY_HEADER:-X-Search-Api-Key}
      SEARCH_RELEVANCE_MODE: ${SEARCH_RELEVANCE_MODE:-llm}
      SEARCH_RELEVANCE_MIN_SCORE: ${SEARCH_RELEVANCE_MIN_SCORE:-0.65}
      SEARCH_RELEVANCE_FAIL_OPEN: ${SEARCH_RELEVANCE_FAIL_OPEN:-false}
      SEARCH_RERANK_CANDIDATES: ${SEARCH_RERANK_CANDIDATES:-40}
      SEARCH_CANDIDATE_TEXT_CHARS: ${SEARCH_CANDIDATE_TEXT_CHARS:-2500}
      SEARCH_RESPONSE_CACHE_SECONDS: ${SEARCH_RESPONSE_CACHE_SECONDS:-0}
      SEARCH_RESPONSE_CACHE_SIZE: ${SEARCH_RESPONSE_CACHE_SIZE:-128}
      SEARCH_CURSOR_SECRET: ${SEARCH_CURSOR_SECRET}
      SEARCH_CURSOR_TTL_SECONDS: ${SEARCH_CURSOR_TTL_SECONDS:-900}
      SEARCH_LEGACY_SKIP_LIMIT: ${SEARCH_LEGACY_SKIP_LIMIT:-100}
    ports:
      - "${SEARCH_PORT:-8083}:${APP_PORT:-8083}"
